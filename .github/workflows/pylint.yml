name: Pylint

on: [push]

jobs:
  lint:
    name: Pylint (production code)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-frontend.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          for req in requirements.txt requirements-api.txt requirements-frontend.txt; do
            if [ -f "$req" ]; then
              echo "::group::Installing $req"
              pip install -r "$req"
              echo "::endgroup::"
            fi
          done
          pip install pylint

      - name: Analysing production code with pylint
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/frontend
        run: |
          pylint --rcfile=.pylintrc --fail-under=9.0 --fail-on=E src frontend
